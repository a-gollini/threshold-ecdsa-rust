[package]
name = "threshold-ecdsa-rust"
version = "0.1.0"
edition = "2024"
description = "Educational threshold ECDSA on secp256k1 (Shamir/Feldman VSS, Joint-Feldman DKG, threshold signing)"
license = "MIT"
readme = "README.md"

[dependencies]
axum = "0.8.9"
num-bigint = "0.5.1"
num-traits = "0.2.19"
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
k256 = "0.14.0"
tower = { version = "0.5.3", features = ["util"] }

[lib]
name = "threshold_ecdsa"

# Big-integer arithmetic is painfully slow without optimisations, tests included.
[profile.dev]
opt-level = 3
